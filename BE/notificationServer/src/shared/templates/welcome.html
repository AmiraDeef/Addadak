<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بك في عدادك</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #5cb85c; }
    .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
    .header h1 { color: #5cb85c; margin: 0; }
    .content p { font-size: 16px; line-height: 1.6; }
    .footer { text-align: center; font-size: 14px; color: #777; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>عدادك - Addadak</h1>
    </div>
    <div class="content">
      <p>مرحباً <strong>{{userName}}</strong>،</p>
      <p>أهلاً بك في نظام <strong>عدادك الذكي</strong>. يسعدنا انضمامك إلينا لمتابعة استهلاكك وإدارة فواتيرك بكل سهولة.</p>
      <p>يمكنك الآن تسجيل الدخول إلى التطبيق لإضافة عدادك والبدء في متابعة استهلاكك أولاً بأول.</p>
    </div>
    <div class="footer">
      <p>شكراً لاستخدامك نظام عدادك الذكي.</p>
      <p>&copy; {{date}} Addadak. جميع الحقوق محفوظة.</p>
    </div>
  </div>
</body>
</html>
